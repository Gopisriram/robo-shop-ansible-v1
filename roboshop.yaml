- name: create ec2 intance and route53 record
  hosts: localhost
  connection: local
  vars:
    instances: ["mangodb", "redis", "mysql", "rabbitmq"]
    domain: srgokr.store
    action: create
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: roboshop-"{{ item}}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - roboshop-common
      - "roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"
    when: "{{ action == 'create' }}"
